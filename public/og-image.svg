<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bandDeep" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#070A12"/>
      <stop offset="50%" stop-color="#0A0E18"/>
      <stop offset="100%" stop-color="#070A12"/>
    </linearGradient>
    <radialGradient id="amberGlow" cx="50%" cy="48%" r="48%">
      <stop offset="0%" stop-color="#FFB020" stop-opacity="0.35"/>
      <stop offset="55%" stop-color="#FFB020" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#FFB020" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hairline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFB020" stop-opacity="0"/>
      <stop offset="30%" stop-color="#FFB020" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#FFD466" stop-opacity="0.85"/>
      <stop offset="70%" stop-color="#FFB020" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#FFB020" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background band-deep -->
  <rect width="1200" height="630" fill="url(#bandDeep)"/>

  <!-- Amber glow centrale -->
  <ellipse cx="600" cy="305" rx="720" ry="340" fill="url(#amberGlow)"/>

  <!-- Top hairline signature -->
  <rect x="380" y="60" width="440" height="1" fill="url(#hairline)" opacity="0.75"/>

  <!-- Eyebrow -->
  <text x="600" y="155" text-anchor="middle"
        font-family="'Geist Mono', 'SF Mono', Menlo, ui-monospace, monospace"
        font-size="18" font-weight="500"
        fill="#FFB020"
        letter-spacing="4"
        style="text-transform: uppercase">EUROCOMPL/AI · UN PRODOTTO DI INTEGROUP</text>

  <!-- Logomark a grande scala -->
  <g font-family="'Geist Mono', 'SF Mono', Menlo, ui-monospace, monospace" text-anchor="middle">
    <text x="600" y="335" font-size="110" font-weight="500" letter-spacing="-1">
      <tspan fill="#5A6378" font-weight="400">[</tspan><tspan fill="#F4F6FB">eurocompl</tspan><tspan fill="#5A6378">/</tspan><tspan fill="#FFB020" font-weight="700">ai</tspan><tspan fill="#5A6378" font-weight="400">]</tspan>
    </text>
  </g>

  <!-- Tagline -->
  <text x="600" y="430" text-anchor="middle"
        font-family="'Geist', -apple-system, system-ui, sans-serif"
        font-size="28" font-weight="500"
        fill="#F4F6FB"
        letter-spacing="-0.5">Compliance integrata per GDPR, NIS2, AI Act.</text>

  <text x="600" y="473" text-anchor="middle"
        font-family="'Geist', -apple-system, system-ui, sans-serif"
        font-size="22" font-weight="400"
        fill="#9CA5B8"
        letter-spacing="-0.2">Tre normative. Un sistema che estrae, intervista, genera.</text>

  <!-- Bottom hairline signature -->
  <rect x="380" y="555" width="440" height="1" fill="url(#hairline)" opacity="0.6"/>

  <!-- Bottom monospace tagline -->
  <text x="600" y="585" text-anchor="middle"
        font-family="'Geist Mono', 'SF Mono', Menlo, ui-monospace, monospace"
        font-size="13" font-weight="500"
        fill="#5A6378"
        letter-spacing="3"
        style="text-transform: uppercase">EUROCOMPLAI.COM</text>
</svg>
